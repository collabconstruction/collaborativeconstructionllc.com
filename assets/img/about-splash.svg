<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Decorative backdrop for the About page. No background fill: the page
       colour shows through. Brass is the main colour, with a little navy and
       pale gold so it reads on both the cream page and the navy page hero.
       The turbulence filter roughens the edges so the strokes look painted
       on canvas and not drawn with a ruler. -->
  <defs>
    <filter id="paint" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="G" yChannelSelector="R" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- wide brush strokes -->
  <g filter="url(#paint)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-60 250C230 90 470 330 760 230S1250 40 1680 190" stroke="#bda16a" stroke-opacity=".30" stroke-width="64"/>
    <path d="M-80 330C210 190 480 420 780 320S1240 150 1690 290" stroke="#bda16a" stroke-opacity=".16" stroke-width="22"/>
    <path d="M1700 640C1380 520 1160 760 880 700S380 560 -80 760" stroke="#182b49" stroke-opacity=".12" stroke-width="82"/>
    <path d="M1690 700C1370 600 1170 830 890 780S390 650 -70 840" stroke="#bda16a" stroke-opacity=".20" stroke-width="30"/>
    <path d="M-40 1130C260 980 520 1250 830 1150S1330 960 1660 1110" stroke="#bda16a" stroke-opacity=".26" stroke-width="58"/>
    <path d="M-60 1215C250 1075 530 1330 840 1235S1340 1050 1680 1190" stroke="#182b49" stroke-opacity=".10" stroke-width="20"/>
  </g>

  <!-- paint splashes with flung droplets -->
  <g filter="url(#paint)" fill="#bda16a">
    <path fill-opacity=".30" d="M1285 365c42-58 128-48 158 6s-6 128-70 142-132-16-122-72c3-30 15-54 34-76z"/>
    <circle fill-opacity=".24" cx="1500" cy="318" r="18"/>
    <circle fill-opacity=".20" cx="1546" cy="392" r="10"/>
    <circle fill-opacity=".26" cx="1236" cy="506" r="13"/>
    <circle fill-opacity=".18" cx="1182" cy="318" r="8"/>
    <circle fill-opacity=".22" cx="1424" cy="560" r="7"/>

    <path fill-opacity=".26" d="M214 948c-36-52-14-120 52-134s126 30 112 90-60 100-116 96-38-26-48-52z"/>
    <circle fill-opacity=".22" cx="132" cy="860" r="15"/>
    <circle fill-opacity=".18" cx="96" cy="1008" r="9"/>
    <circle fill-opacity=".24" cx="418" cy="1012" r="11"/>
    <circle fill-opacity=".16" cx="352" cy="778" r="7"/>
  </g>

  <!-- fine survey lines, the same language as the logo contours -->
  <g filter="url(#soft)" fill="none" stroke="#bda16a" stroke-width="1.6" stroke-opacity=".34">
    <path d="M-100 520C240 360 520 640 860 520S1340 380 1700 520"/>
    <path d="M-100 560C240 400 520 680 860 560S1340 420 1700 560"/>
    <path d="M-100 600C240 440 520 720 860 600S1340 460 1700 600"/>
    <path d="M-100 1010C260 870 560 1090 880 990S1380 860 1700 980"/>
    <path d="M-100 1050C260 910 560 1130 880 1030S1380 900 1700 1020"/>
    <ellipse cx="800" cy="750" rx="640" ry="310" stroke-opacity=".16" transform="rotate(-4 800 750)"/>
    <ellipse cx="800" cy="750" rx="560" ry="260" stroke-opacity=".12" transform="rotate(-4 800 750)"/>
  </g>

  <!-- scattered dots -->
  <g fill="#bda16a" fill-opacity=".38">
    <circle cx="610" cy="140" r="4"/><circle cx="668" cy="96" r="2.5"/><circle cx="1010" cy="120" r="3.5"/>
    <circle cx="1090" cy="640" r="3"/><circle cx="260" cy="590" r="3.5"/><circle cx="190" cy="660" r="2.5"/>
    <circle cx="760" cy="1390" r="4"/><circle cx="1180" cy="1330" r="3"/><circle cx="1330" cy="1420" r="2.5"/>
    <circle cx="520" cy="1330" r="3"/><circle cx="1470" cy="900" r="3.5"/><circle cx="1390" cy="980" r="2.5"/>
  </g>
</svg>
